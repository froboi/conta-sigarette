services:
  quitstats:
    build:
      context: .
    container_name: quitstats
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////app/data/quitstats.db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    ports:
      - "${QUITSTATS_PORT:-5000}:5000"
    volumes:
      - quitstats-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  quitstats-data:
